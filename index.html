<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff5eb;padding-bottom:70px}
.top{background:#000;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;position:sticky;top:0;z-index:99}
.top b{font-size:32px;color:#ff6b00}
.top b span{color:#fff}
.top span{font-size:22px;margin-left:12px;color:#fff}
.mind{background:#fff;display:flex;gap:8px;align-items:center;padding:12px;margin:10px;border-radius:15px;border:1px solid #ffd9b3}
.mind img{width:42px;height:42px;border-radius:50%;border:2px solid #ff6b00}
.mind input{flex:1;background:#fff5eb;border:none;padding:12px;border-radius:20px;font-size:15px}
.post-btn{background:#ff6b00;color:#fff;border:none;padding:13px;width:100%;border-radius:10px;font-weight:bold;font-size:17px;margin-top:10px}
.stories{display:flex;gap:8px;overflow-x:auto;padding:10px}
.story{min-width:110px;height:180px;border-radius:15px;overflow:hidden;position:relative;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.story.orange{background:#ff6b00}
.story.black{background:#000}
.story div{font-size:40px}
.post{background:#fff;margin:10px;border-radius:15px;overflow:hidden;border:1px solid #ffd9b3}
.head{display:flex;gap:10px;align-items:center;padding:10px}
.head img{width:40px;height:40px;border-radius:50%}
.head small{color:#888}
.post p{padding:10px}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:12px;color:#555}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.bottom div{text-align:center;font-size:12px;color:#fff;font-weight:bold}
.bottom div.active{color:#ff6b00}
.bottom div span{font-size:24px;display:block}
</style>
</head>
<body>

<div class="top"><b>TAP<span> 🔥</span></b><div><span>➕</span><span>🔍</span><span>💬</span></div></div>

<div class="mind">
<img src="https://picsum.photos/100">
<input id="mind" placeholder="Unafikiria nini? / What's on your mind?">
</div>
<div style="background:#fff;margin:0 10px 10px;padding:0 12px 12px;border-radius:0 0 15px 15px">
<button class="post-btn" onclick="postIt()">POST SASA 🔥</button>
</div>

<div class="stories">
<div class="story orange"><div>+</div><p>Create story</p></div>
<div class="story black"><div>▶️</div><p>Create reel</p></div>
</div>

<div id="feed">
<div class="post"><div class="head"><img src="https://picsum.photos/100"><div><b>Said KAPWILE</b><br><small>Sasa hivi • 🌍</small></div></div><p>Karibu TAP! Hapa ni nyumbani kwetu. Post chochote unachofikiria 🔥</p><div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗️ Share</span></div></div>
</div>

<div class="bottom">
<div class="active" onclick="window.scrollTo(0,0)"><span>🏠</span>Home</div>
<div><span>▶️</span>Reels</div>
<div onclick="document.getElementById('mind').focus()"><span>➕</span>Post</div>
<div><span>👤</span>Profile</div>
</div>

<script>
function postIt(){
let t=document.getElementById('mind').value;
if(!t){alert('Andika kitu kwanza!');return;}
let d=document.createElement('div');
d.className='post';
d.innerHTML='<div class="head"><img src="https://picsum.photos/100"><div><b>Said KAPWILE</b><br><small>Sasa hivi • 🌍</small></div></div><p>'+t+'</p><div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗️ Share</span></div>';
document.getElementById('feed').prepend(d);
document.getElementById('mind').value='';
}
</script>
</body>
</html>
