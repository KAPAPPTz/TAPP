<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5}
.top{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px;position:sticky;top:0;z-index:99;box-shadow:0 1px 5px #ccc}
.top b{font-size:30px;color:#1877f2}
.top span{font-size:22px;margin-left:12px}
.mind{background:#fff;display:flex;gap:8px;align-items:center;padding:12px;margin:10px 10px 0;border-radius:10px}
.mind img{width:40px;height:40px;border-radius:50%}
.mind input{flex:1;background:#f0f2f5;border:none;padding:12px;border-radius:20px;font-size:15px}
.stories{display:flex;gap:8px;overflow-x:auto;padding:10px}
.story{min-width:110px;height:180px;border-radius:10px;overflow:hidden;position:relative;background:#000;color:#fff}
.story img{width:100%;height:100%;object-fit:cover}
.story p{position:absolute;bottom:8px;left:8px;font-weight:bold;font-size:13px}
.create{background:#1877f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.create div{font-size:40px}
.create2{background:#e91e63;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.post{background:#fff;margin:10px;border-radius:10px;overflow:hidden}
.head{display:flex;gap:10px;align-items:center;padding:10px}
.head img{width:40px;height:40px;border-radius:50%}
.head small{color:#666}
.post img.main{width:100%}
.post p{padding:10px}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:12px;color:#555}
.post-btn{background:#1877f2;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px}
</style>
</head>
<body>

<div class="top"><b>facebook</b><div><span>➕</span><span>🔍</span><span>💬</span></div></div>
<div style="text-align:center;background:#1877f2;color:#fff;padding:6px;font-weight:bold">TAP 🔥 - Kama Facebook, ya Kitanzania</div>

<div class="mind">
<img src="https://picsum.photos/100">
<input id="mind" placeholder="What's on your mind? / Unafikiria nini?">
</div>
<div style="background:#fff;margin:0 10px 10px;padding:0 12px 12px;border-radius:0 0 10px 10px">
<button class="post-btn" onclick="postIt()">POST SASA</button>
</div>

<div class="stories">
<div class="story create"><div>+</div><p>Create story</p></div>
<div class="story create2"><div>▶️</div><p>Create reel</p></div>
<div class="story"><img src="https://picsum.photos/200/300"><p>Werposa Mnaree</p></div>
<div class="story"><img src="https://picsum.photos/201/300"><p>Chrazy Media</p></div>
</div>

<div id="feed">
<div class="post">
<div class="head"><img src="https://picsum.photos/101"><div><b>YANGA FRIENDS</b><br><small>Moris Msafwa • 7h • 🌍</small></div></div>
<img class="main" src="https://picsum.photos/400/300">
<div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗️ Share</span></div>
</div>
</div>

<script>
function postIt(){
let t=document.getElementById('mind').value;
if(!t){alert('Andika kitu kwanza!');return;}
let d=document.createElement('div');
d.className='post';
d.innerHTML='<div class="head"><img src="https://picsum.photos/100"><div><b>Said KAPWILE</b><br><small>Sasa hivi • 🌍</small></div></div><p>'+t+'</p><div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗️ Share</span></div>';
document.getElementById('feed').prepend(d);
document.getElementById('mind').value='';
alert('Post yako imetumwa!');
}
</script>
</body>
</html>
