<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAP - Tabasamu APP</title>
<style>
body{font-family:Arial;background:#fff8f0;margin:0;padding:20px;text-align:center}
.box{background:white;padding:25px;border-radius:20px;max-width:400px;margin:50px auto;box-shadow:0 2px 10px #ddd}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{background:orange;color:white;border:none;padding:12px;width:100%;border-radius:20px;font-weight:bold;font-size:16px}
a{color:orange;font-weight:bold;text-decoration:none}
.logo{font-size:50px}
</style>
</head>
<body>
<div class="box">
<div class="logo">😊</div>
<h1>TAP</h1>
<p>Tabasamu APP - Post, Like, Cheka!</p>
<input id="email" placeholder="Email yako">
<input id="pass" type="password" placeholder="Password">
<button id="loginBtn">Ingia TAP ➤</button>
<p id="msg" style="color:green"></p>
<br>
<a href="feed.html">Ingia kama Mgeni - Tazama Feed ➤</a>
<br><br>
<a href="profile.html">Profile Yangu</a>
</div>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
document.getElementById("loginBtn").onclick = async () => {
  const e = document.getElementById("email").value;
  const p = document.getElementById("pass").value;
  if(!e || !p) return alert("Weka email na password!");
  try {
    await signInWithEmailAndPassword(auth, e, p);
    document.getElementById("msg").innerText = "Karibu! Unaingia...";
    setTimeout(()=> location.href="feed.html", 1000);
  } catch(err) {
    try {
      await createUserWithEmailAndPassword(auth, e, p);
      document.getElementById("msg").innerText = "Akaunti imefunguliwa! Karibu TAP!";
      setTimeout(()=> location.href="feed.html", 1000);
    } catch(e2){ alert(e2.message); }
  }
};
console.log("index.html IMEUNGANISHWA na Firebase!");
</script>
</body>
</html>

</div>
